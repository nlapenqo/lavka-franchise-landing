<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>01 · Меню · v2 — Тихая шапка + плавающая CTA</title>
<link rel="stylesheet" href="../_shared/tokens.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  body { overflow-x: clip; background: var(--bg-light); }
  .quiet-head { position: fixed; z-index: 30; inset: 0 0 auto; min-height: 78px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 28px; padding-inline: var(--container-pad); background: color-mix(in srgb, var(--bg) 88%, transparent); border-bottom: 1px solid var(--sky); backdrop-filter: blur(16px); }
  .logo { font-weight: 900; font-size: 21px; letter-spacing: -.02em; white-space: nowrap; }
  .logo span { color: var(--blue); }
  .nav { display: flex; justify-content: center; gap: 8px; }
  .nav a { padding: 10px 16px; border-radius: var(--r-pill); color: var(--text-dim); font-size: 15px; font-weight: 500; transition: background var(--dur-fast), color var(--dur-fast); }
  .nav a:hover { background: var(--bg-card); color: var(--navy); }
  .tg { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
  .tg svg { width: 20px; }
  .floating-cta { position: fixed; z-index: 40; left: 50%; bottom: 24px; translate: -50% 0; min-width: 260px; justify-content: space-between; box-shadow: 0 14px 38px color-mix(in srgb, var(--navy) 28%, transparent); }
  .floating-cta svg { width: 22px; }
  .demo { min-height: 150vh; padding: 180px var(--container-pad) 120px; background: linear-gradient(150deg, var(--bg-light), var(--sky)); }
  .demo__inner { max-width: var(--container); margin-inline: auto; display: grid; grid-template-columns: 1fr .75fr; gap: 60px; align-items: center; }
  .demo h1 { max-width: 820px; }
  .demo p { align-self: end; color: var(--text-dim); }
  .orbit { margin-top: 90px; width: min(100%, 900px); height: 200px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .orbit span { border-radius: 50%; background: var(--blue); } .orbit span:nth-child(2) { background: var(--peach); } .orbit span:nth-child(3) { background: var(--lavender); }
  .legal { margin-top: 80px; }
  @media (max-width: 780px) { .quiet-head { grid-template-columns: 1fr auto; } .nav { display: none; } .demo__inner { grid-template-columns: 1fr; } .demo p { max-width: 460px; } }
  @media (max-width: 420px) { .tg span { display: none; } .floating-cta { width: calc(100% - 40px); min-width: 0; } }
</style>
</head>
<body>
<div class="proto-tag">01 · Меню · v2 — Тихая шапка + плавающая CTA</div>
<header class="quiet-head">
  <a class="logo" href="#">Яндекс <span>Лавка</span> · Франшиза</a>
  <nav class="nav" aria-label="Основная навигация"><a href="#formats">Форматы</a><a href="#steps">Путь партнёра</a><a href="#faq">Q&amp;A</a></nav>
  <a class="tg" href="https://t.me/yandex_lavka_franchise"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m21 4-3 16-6-5-4 3 1-5 8-6-10 5-4-2 18-6Z"/></svg><span>Telegram</span></a>
</header>
<a class="btn btn--blue floating-cta" href="#form"><span>Стать партнёром</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a>
<main class="demo"><div class="demo__inner"><h1 class="t-hero">Меню не спорит с контентом</h1><p class="t-sub">Главное действие всегда остаётся в зоне большого пальца</p></div><div class="orbit" aria-hidden="true"><span>&#8203;</span><span>&#8203;</span><span>&#8203;</span></div><p class="t-legal legal">Прототип · данные — заглушка (рыба)</p></main>
<script src="../_shared/proto.js" defer></script>
<script src="../_shared/preview-shell.js" defer></script>

</html>
