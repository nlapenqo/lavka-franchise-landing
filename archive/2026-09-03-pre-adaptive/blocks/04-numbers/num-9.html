  .txt { position: relative; z-index: 1; max-width: 560px; }
  .txt h3 { font-weight: 900; font-size: clamp(30px, 3.4vw, 52px); line-height: .98; letter-spacing: -.01em; color: var(--navy); }
  .txt p { margin-top: 14px; font-size: clamp(14px, 1.25vw, 18px); line-height: 1.35; color: var(--text-dim); max-width: 470px; }

</style>
