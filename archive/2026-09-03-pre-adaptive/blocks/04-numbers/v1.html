<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>04 · Цифры · v1 — Bento-каунтеры</title>
<link rel="stylesheet" href="../_shared/tokens.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  body { overflow-x: clip; }

  /* --- соседние блоки-заглушки --- */
  .ghost {
    height: 42vh;
    display: grid; place-items: center;
    background: var(--bg-light);
    outline: 1.5px dashed var(--sky); outline-offset: -14px;
  }
  .ghost span {
    font-weight: 500; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--text-dim); opacity: .55;
  }

  /* ============ 04 · v1 — bento-каунтеры ============ */
  .numbers { background: var(--bg); padding-block: var(--section-pad); }
  .numbers .t-label { display: block; margin-bottom: clamp(20px, 2.5vw, 32px); }

  .bento {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr;
    gap: 16px;
  }
  .cell {
    position: relative;
    display: flex; flex-direction: column;
    min-height: clamp(260px, 24vw, 340px);
    overflow: hidden;
  }
  .cell__num {
    font-weight: 900; line-height: .85; letter-spacing: -.02em;
    font-size: clamp(56px, 7.5vw, 116px);
  }
  .cell__cap {
    margin-top: 14px;
    font-weight: 500; font-size: clamp(15px, 1.3vw, 19px); line-height: 1.2;
    max-width: 240px;
  }

  /* — плашка 1: navy, гигантская цифра, орбиты — */
  .cell--lead .cell__num { font-size: var(--fs-mega); color: #fff; }
  .cell--lead .cell__cap { color: var(--text-dim-dark); }
  .orbits {
    display: flex; gap: 12px;
    margin-top: auto; padding-top: 24px;
  }
  .orbit { flex: 1; height: clamp(44px, 4.6vw, 66px); border-radius: 50%; }
  .orbit--blue     { background: var(--blue); }
  .orbit--photo    { background: linear-gradient(135deg, var(--sky) 0%, var(--pink) 55%, var(--peach) 100%); }
  .orbit--lavender { background: var(--lavender); }

  /* — плашка 2: bg-card — */
  .cell--work .cell__num { color: var(--navy); }
  .cell--work .cell__cap { color: var(--text-dim); }

  /* — плашка 3: sky + оранжевый чип — */
  .cell--seek .cell__num { color: var(--navy); }
  .cell--seek .cell__cap { color: var(--navy); opacity: .75; }
  .chip--orange {
    position: absolute; top: 22px; right: 22px;
    background: var(--orange); color: #fff;
    font-size: 13px;
  }

  .cell--work .cell__num, .cell--seek .cell__num { margin-top: auto; }
  .cell--work .cell__cap, .cell--seek .cell__cap { padding-bottom: 4px; }

  @media (max-width: 900px) {
    .bento { grid-template-columns: 1.2fr 1fr; }
    .cell--seek { grid-column: 1 / -1; min-height: 220px; }
  }
  @media (max-width: 600px) {
    .bento { grid-template-columns: 1fr; }
    .cell { min-height: 230px; }
    .cell--seek { min-height: 200px; }
  }

  .legal { text-align: center; padding: 22px 16px 30px; }
</style>
</head>
<body>
  <div class="proto-tag">04 · Цифры · v1 — Bento-каунтеры</div>

  <section class="ghost"><span>соседний блок</span></section>

  <section class="numbers">
    <div class="container">
      <span class="t-label reveal">Масштаб сети</span>

      <div class="bento">

        <div class="card card--navy cell cell--lead reveal">
          <div class="cell__num"><span data-count="14">0</span></div>
          <p class="cell__cap">городов запущено по&nbsp;франшизе</p>
          <div class="orbits" aria-hidden="true">
            <div class="orbit orbit--blue"></div>
            <div class="orbit orbit--photo"></div>
            <div class="orbit orbit--lavender"></div>
          </div>
        </div>

        <div class="card cell cell--work reveal reveal-d1">
          <div class="cell__num"><span data-count="25">0</span></div>
          <p class="cell__cap">городов в&nbsp;работе</p>
        </div>

        <div class="card card--sky cell cell--seek reveal reveal-d2">
          <span class="chip chip--orange">набор открыт</span>
          <div class="cell__num"><span data-count="9">0</span></div>
          <p class="cell__cap">партнёров ищем сейчас</p>
        </div>

      </div>
    </div>
  </section>

  <section class="ghost"><span>соседний блок</span></section>

  <p class="t-legal legal">Прототип · данные — заглушка (рыба)</p>

  <script src="../_shared/proto.js" defer></script>
<script src="../_shared/preview-shell.js" defer></script>
</body>
</html>
