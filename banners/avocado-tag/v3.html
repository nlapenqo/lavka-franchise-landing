<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>v3 — Маятник</title>

<style>
.pre .a{opacity:0}
.tag{left:315.35px;top:120.6px;transform-origin:253.85px 16.6px}
@keyframes v3tag{
  0%{opacity:0;transform:translate(200px,100px) rotate(6deg) scale(2.3);animation-timing-function:cubic-bezier(.22,.61,.36,1)}
  20%{opacity:1;transform:translate(200px,100px) rotate(-13deg) scale(2.3);animation-timing-function:cubic-bezier(.65,0,.35,1)}
  40%{opacity:1;transform:translate(200px,100px) rotate(1deg) scale(2.3);animation-timing-function:cubic-bezier(.55,0,.15,1)}
  70%{opacity:1;transform:translate(0px,0px) rotate(-11deg) scale(1);animation-timing-function:cubic-bezier(.65,0,.35,1)}
  82.5%{opacity:1;transform:translate(0px,0px) rotate(-3.5deg) scale(1);animation-timing-function:cubic-bezier(.65,0,.35,1)}
  92.5%{opacity:1;transform:translate(0px,0px) rotate(-7deg) scale(1);animation-timing-function:cubic-bezier(.65,0,.35,1)}
  100%{opacity:1;transform:translate(0px,0px) rotate(-6deg) scale(1)}
}
.play .tag{animation:v3tag 2s linear both}
.tag__string path{stroke-dasharray:1}
@keyframes v3string{
  0%{stroke-dashoffset:-1;opacity:0}
  74.286%{stroke-dashoffset:-1;opacity:0}
  75%{stroke-dashoffset:-1;opacity:1;animation-timing-function:cubic-bezier(.4,0,.2,1)}
  100%{stroke-dashoffset:0;opacity:1}
}
.play .tag__string path{animation:v3string 1.4s linear both}
@keyframes v3knot{
  0%{opacity:0;transform:scale(0)}
  88.158%{opacity:0;transform:scale(0);animation-timing-function:cubic-bezier(.34,1.45,.64,1)}
  100%{opacity:1;transform:scale(1)}
}
.play .tag__knot{animation:v3knot 1.52s linear both}
.avo{transform-origin:133px 68px}
@keyframes v3avo{
  0%{opacity:0;transform:scale(.96)}
  57.692%{opacity:0;transform:scale(.96);animation-timing-function:cubic-bezier(.16,1,.3,1)}
  100%{opacity:1;transform:scale(1)}
}
.play .avo{animation:v3avo 1.3s linear both}
@keyframes v3logo{
  0%{opacity:0;transform:translateY(18px)}
  65.385%{opacity:0;transform:translateY(18px);animation-timing-function:cubic-bezier(.16,1,.3,1)}

}

@keyframes v3pill{

}

@keyframes v3age{
  0%{opacity:0;transform:translateY(18px)}
  74.86%{opacity:0;transform:translateY(18px);animation-timing-function:cubic-bezier(.16,1,.3,1)}

}

@keyframes v3legal{

@keyframes v3strike{

  84.375%{clip-path:inset(0 100% 0 0);animation-timing-function:cubic-bezier(.4,0,.2,1)}
  100%{clip-path:inset(0 0 0 0)}
}
.play .strike{animation:v3strike 1.6s linear both}
</style></head><body>
<div class="banner pre">
  <div class="bg"></div>
  <img class="noise" src="assets/bg-noise.svg" alt="">

    <svg class="tag__string" viewBox="0 0 55.0003 33.0003" fill="none" aria-hidden="true"><path pathLength="1" d="M53.5003 1.50001C29.5003 2.16668 12.1669 12.1667 1.50028 31.5" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
    <img class="tag__knot" src="assets/knot.svg" alt="">
  </div>
</div>
<script>
(() => {
  const b = document.querySelector('.banner');
  const start = () => { b.classList.remove('pre'); b.classList.add('play'); };
  const replay = () => { b.classList.remove('play'); b.classList.add('pre'); void b.offsetWidth; requestAnimationFrame(() => requestAnimationFrame(start)); };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(start, 150));
  b.addEventListener('click', replay);
})();
</script>
</body></html>
