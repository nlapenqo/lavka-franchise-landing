<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>v4 — Заголовок</title>
<link rel="stylesheet" href="banner.css?v=20260915i">
<style>
.pre .a{opacity:0}
@keyframes v4tag{
  0%{opacity:0;transform:translate(97px,196px) rotate(0deg) scale(2.6);animation-timing-function:cubic-bezier(.16,1,.3,1)}
  23.256%{opacity:1;transform:translate(97px,184px) rotate(0deg) scale(2.6)}
  62.791%{opacity:1;transform:translate(97px,184px) rotate(0deg) scale(2.6);animation-timing-function:cubic-bezier(.55,0,.15,1)}
  90.698%{opacity:1;transform:translate(0px,0px) rotate(-8.5deg) scale(1);animation-timing-function:cubic-bezier(.22,.61,.36,1)}
  100%{opacity:1;transform:translate(0px,0px) rotate(-6deg) scale(1)}
}
.play .tag{animation:v4tag 2.15s linear both}
@keyframes v4body{
  0%{opacity:0;clip-path:inset(0 100% 0 0 round 14px)}
  62.5%{opacity:1;clip-path:inset(0 100% 0 0 round 14px);animation-timing-function:cubic-bezier(.16,1,.3,1)}
  100%{opacity:1;clip-path:inset(0 0 0 0 round 14px)}
}
.play .tag__body{animation:v4body 1.2s linear both}
@keyframes v4ring{
  0%{opacity:0}
  80.769%{opacity:0;animation-timing-function:cubic-bezier(.22,.61,.36,1)}
  100%{opacity:1}
}
.play .tag__ring{animation:v4ring 1.3s linear both}
@keyframes v4string{
  0%{opacity:0}
  80.769%{opacity:0;animation-timing-function:cubic-bezier(.22,.61,.36,1)}
  100%{opacity:1}
}
.play .tag__string{animation:v4string 1.3s linear both}
@keyframes v4knot{
  0%{opacity:0}
  80.769%{opacity:0;animation-timing-function:cubic-bezier(.22,.61,.36,1)}
  100%{opacity:1}
}
.play .tag__knot{animation:v4knot 1.3s linear both}
@keyframes v4avo{
  0%{opacity:0;transform:translateX(160px)}
  60%{opacity:0;transform:translateX(160px);animation-timing-function:cubic-bezier(.16,1,.3,1)}
  100%{opacity:1;transform:translateX(0)}
}
.play .avo{animation:v4avo 1.75s linear both}
@keyframes v4logo{
  0%{opacity:0;transform:translateY(-12px)}
  80.769%{opacity:0;transform:translateY(-12px);animation-timing-function:cubic-bezier(.16,1,.3,1)}
  100%{opacity:1;transform:translateY(0)}
}
.play .logo{animation:v4logo 2.6s linear both}
@keyframes v4pill{
  0%{opacity:0;transform:scale(.85)}
  83.019%{opacity:0;transform:scale(.85);animation-timing-function:cubic-bezier(.34,1.45,.64,1)}
  100%{opacity:1;transform:scale(1)}
}
.play .pill{animation:v4pill 2.6500000000000004s linear both}
@keyframes v4price{
  0%{opacity:0;transform:translateY(24px)}
  79.31%{opacity:0;transform:translateY(24px);animation-timing-function:cubic-bezier(.16,1,.3,1)}
  100%{opacity:1;transform:translateY(0)}
}
.play .price{animation:v4price 2.9s linear both}
@keyframes v4rub{
  0%{opacity:0;transform:translateY(24px)}
  81.356%{opacity:0;transform:translateY(24px);animation-timing-function:cubic-bezier(.16,1,.3,1)}
  100%{opacity:1;transform:translateY(0)}
}
.play .rub{animation:v4rub 2.95s linear both}
@keyframes v4old{
  0%{opacity:0;transform:translateY(12px)}
  83.051%{opacity:0;transform:translateY(12px);animation-timing-function:cubic-bezier(.16,1,.3,1)}
  100%{opacity:1;transform:translateY(0)}
}
.play .old{animation:v4old 2.95s linear both}
@keyframes v4star{
  0%{opacity:0;transform:scale(0) rotate(-40deg) rotate(-135deg)}
  83.051%{opacity:0;transform:scale(0) rotate(-40deg) rotate(-135deg);animation-timing-function:cubic-bezier(.16,1,.3,1)}
  100%{opacity:1;transform:scale(1) rotate(0deg) rotate(-135deg)}
}
.play .star{animation:v4star 2.95s linear both}
@keyframes v4strike{
  0%{clip-path:inset(0 100% 0 0)}
  90%{clip-path:inset(0 100% 0 0);animation-timing-function:cubic-bezier(.4,0,.2,1)}
  100%{clip-path:inset(0 0 0 0)}
}
.play .strike{animation:v4strike 3s linear both}
@keyframes v4name{
  0%{opacity:0;transform:translateY(16px)}
  82.258%{opacity:0;transform:translateY(16px);animation-timing-function:cubic-bezier(.16,1,.3,1)}
  100%{opacity:1;transform:translateY(0)}
}
.play .name{animation:v4name 3.0999999999999996s linear both}
@keyframes v4age{
  0%{opacity:0;transform:none}
  84.615%{opacity:0;transform:none;animation-timing-function:cubic-bezier(.16,1,.3,1)}
  100%{opacity:1;transform:none}
}
.play .age{animation:v4age 3.25s linear both}
@keyframes v4legal{
  0%{opacity:0;transform:none}
  84.848%{opacity:0;transform:none;animation-timing-function:cubic-bezier(.16,1,.3,1)}
  100%{opacity:1;transform:none}
}
.play .legal{animation:v4legal 3.3s linear both}
</style></head><body>
<div class="banner pre">
  <div class="bg"></div>
  <img class="noise" src="assets/bg-noise.svg" alt="">
  <div class="avo a">
    <div class="sh sh1"></div><div class="sh sh2"></div><div class="sh sh3"></div><div class="sh sh4"></div>
    <img class="avo__img" src="assets/avocado.png" alt="">
  </div>
  <img class="logo a" src="assets/logo.svg" alt="Яндекс Лавка">
  <div class="pill cap a">–25%</div>
  <img class="star a" src="assets/star.svg" alt="">
  <p class="price cap a">179</p>
  <p class="rub cap a">₽</p>
  <p class="old cap a">239</p>
  <img class="strike a" src="assets/strike.svg" alt="">
  <p class="name cap a">Авокадо Хасс, <span>2 шт</span></p>
  <p class="age a">0+</p>

ООО «Яндекс.Лавка» (123112, г. Москва,
пр. 1-й Красногвардейский, д. 22, стр. 1,
эт. 12, пом. 12-40, ОГРН 1187746479250)</p>
  <div class="tag a">
    <img class="tag__body" src="assets/tag-body.svg" alt="">
    <img class="tag__ring" src="assets/tag-ring.svg" alt="">
    <p class="tag__text">большие<br>скидки</p>
    <svg class="tag__string" viewBox="0 0 55.0003 33.0003" fill="none" aria-hidden="true"><path pathLength="1" d="M53.5003 1.50001C29.5003 2.16668 12.1669 12.1667 1.50028 31.5" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
    <img class="tag__knot" src="assets/knot.svg" alt="">
  </div>
</div>
<script>
(() => {
  const b = document.querySelector('.banner');
  const start = () => { b.classList.remove('pre'); b.classList.add('play'); };
  const replay = () => { b.classList.remove('play'); b.classList.add('pre'); void b.offsetWidth; requestAnimationFrame(() => requestAnimationFrame(start)); };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(start, 150));
  b.addEventListener('click', replay);
})();
</script>
</body></html>
