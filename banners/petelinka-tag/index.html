<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Бирка — варианты покачивания</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:'YS Geo';src:url('fonts/YS Geo-Regular.woff2') format('woff2');font-weight:400}
@font-face{font-family:'YS Geo';src:url('fonts/YS Geo-Medium.woff2') format('woff2');font-weight:500}
body{margin:0;padding:40px;background:#f2f7fc;color:#1b3a6a;font:16px/1.45 'YS Geo',Arial,sans-serif}
h1{font-size:28px;font-weight:500;margin:0 0 6px}
p.lead{margin:0 0 28px;color:#5a749b;max-width:760px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:36px 32px}
figure{margin:0}
.frame{width:480px;height:360px;overflow:hidden;border-radius:12px;box-shadow:0 8px 30px rgba(27,58,106,.12)}
iframe{width:960px;height:720px;border:0;transform:scale(.5);transform-origin:0 0;display:block}
figcaption{display:grid;gap:6px;margin-top:12px;max-width:480px}
figcaption b{font-weight:500;font-size:18px}
figcaption span{color:#5a749b;font-size:14px}
.row{display:flex;gap:14px;align-items:center;margin-top:4px}
a{color:#00adff}
button{font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:0;background:#00adff;color:#fff;cursor:pointer}
button:hover{background:#0095db}
</style></head><body>
<h1>Бирка «большие скидки» — варианты покачивания</h1>
<p class="lead">Появление сцены во всех вариантах одинаковое и на четверть медленнее прежнего. Отличается только физика бирки после появления: углы посчитаны по формуле маятника, поэтому отпускание переходит в покачивание без стыка. Клик по баннеру — повтор.</p>
<div class="grid">
  <figure>
    <div class="frame"><iframe src="v1.html" title="v1 — Маятник" loading="eager"></iframe></div>
    <figcaption><b>v1 · Маятник</b><span>Бирку отпускают, и она качается как настоящий маятник: период 2.6 с, размах быстро гаснет с 9° до 0.9° и дальше держится еле заметным. Самое «физичное» поведение.</span><span class="row"><a href="v1.html" target="_blank">Открыть</a><button type="button">Повторить</button></span></figcaption>
  </figure>
  <figure>
    <div class="frame"><iframe src="v2.html" title="v2 — Дыхание" loading="eager"></iframe></div>
    <figcaption><b>v2 · Дыхание</b><span>Один медленный синус ±2° с периодом 7 с: бирка почти не качается, а «дышит». Самый спокойный вариант, движение заметно только боковым зрением.</span><span class="row"><a href="v2.html" target="_blank">Открыть</a><button type="button">Повторить</button></span></figcaption>
  </figure>
  <figure>
    <div class="frame"><iframe src="v3.html" title="v3 — Два ветра" loading="eager"></iframe></div>
    <figcaption><b>v3 · Два ветра</b><span>Сумма двух качаний: медленное ±2° с периодом 8.4 с и мелкое поверх него с периодом 2.8 с. Рисунок движения не повторяется на глаз, как у бирки на слабом сквозняке.</span><span class="row"><a href="v3.html" target="_blank">Открыть</a><button type="button">Повторить</button></span></figcaption>
  </figure>
  <figure>
    <div class="frame"><iframe src="v4.html" title="v4 — Порывы" loading="eager"></iframe></div>
    <figcaption><b>v4 · Порывы</b><span>Бирка стоит почти неподвижно, и раз в 6 с её мягко подхватывает воздух: качание нарастает без толчка и само затухает к следующему разу.</span><span class="row"><a href="v4.html" target="_blank">Открыть</a><button type="button">Повторить</button></span></figcaption>
  </figure>
  <figure>
    <div class="frame"><iframe src="v5.html" title="v5 — Маятник с порывами" loading="eager"></iframe></div>
    <figcaption><b>v5 · Маятник с порывами</b><span>Постоянное еле заметное качание ±0.8°, и раз в 6 с воздух добавляет более широкий ход. Живее «Дыхания», но без резких движений.</span><span class="row"><a href="v5.html" target="_blank">Открыть</a><button type="button">Повторить</button></span></figcaption>
  </figure>
</div>
<script>
document.querySelectorAll('figure button').forEach(b => b.addEventListener('click', () => { b.closest('figure').querySelector('iframe').contentWindow.location.reload(); }));
</script>
</body></html>
