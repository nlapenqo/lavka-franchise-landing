<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02 · Hero · city-2&nbsp;— Город во всю ширину</title>
<link rel="stylesheet" href="../_shared/tokens.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  html, body { overflow-x: clip; }

  /* ============ 02 · city-2 ============
     Заголовок прижат влево и построен на контрасте кеглей: две
     служебные строки среднего размера и гигантская строка города.
     Смена города меняет ширину самой крупной строки — это и есть
     единственное движение блока. */

  .hero {
    position: relative;
    min-height: 100svh;
    display: flex; flex-direction: column;
    overflow: hidden;
    background: var(--bg-light);
  }

  /* ---------- Мини-шапка ---------- */
  .top { position: absolute; top: 0; left: 0; right: 0; z-index: 20; padding-block: 22px; }
  .top__in { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .logo {
    display: inline-flex; align-items: center; gap: 10px;
    font-weight: 800; font-size: 21px; letter-spacing: -.01em; color: var(--navy);
  }
  .logo__mark { width: 26px; height: 26px; flex: none; }
  .logo__chip { margin-left: 4px; }
  .btn--sm { font-size: 15px; padding: .62em 1.5em; white-space: nowrap; }

  /* ---------- Лейаут: заголовок сверху, подвал-строка снизу ---------- */
  .hero__in {
    flex: 1; width: 100%;
    display: flex; flex-direction: column; justify-content: center;
    padding-top: 140px; padding-bottom: 104px;
  }

  .hero__h1 {
    color: var(--navy);
    letter-spacing: -.01em;
  }
  .hero__lead {
    display: block;
    font-weight: 800; font-size: var(--fs-h1);
    line-height: .96;
  }
  /* Строка города: максимальный кегль блока */
  .hero__city {
    display: block;
    margin-top: .06em;
    font-weight: 900; font-size: var(--fs-mega);
    line-height: .84; letter-spacing: -.025em;
  }

  /* ---------- Ротация города ---------- */
  .rot {
    position: relative; display: inline-flex; vertical-align: bottom;
    color: var(--blue);
    height: 1em; overflow: hidden;
    /* запас под выносные элементы (р, у, ф) — маска не режет хвосты */
    padding-bottom: .2em; margin-bottom: -.2em; box-sizing: content-box;
    transition: width .7s var(--ease-spring);
    white-space: nowrap;
  }
  .rot__word {
    position: absolute; left: 0; top: 0;
    line-height: 1; display: inline-block;
    transform: translateY(135%); opacity: 0;
    transition: transform .7s var(--ease-spring), opacity .35s var(--ease-out);
    will-change: transform;
  }
  .rot__word.is-cur { transform: none; opacity: 1; }
  .rot__word.is-out { transform: translateY(-125%); opacity: 0; }
  .rot__word.is-final { color: var(--navy); }

  /* ---------- Нижняя строка: подзаголовок слева, CTA справа ---------- */
  .hero__foot {
    display: flex; align-items: flex-end; justify-content: space-between;
    flex-wrap: wrap; gap: 28px 40px;
    margin-top: clamp(40px, 5vw, 72px);
    padding-top: clamp(24px, 3vw, 36px);
    border-top: 1.5px solid rgba(27, 58, 106, .14);
  }
  .hero__sub { max-width: 460px; color: var(--text-dim); }
  .hero__cta { display: flex; align-items: center; flex-wrap: wrap; gap: 16px 26px; }
  .btn--lg { font-size: clamp(17px, 1.5vw, 21px); padding: 1.1em 2.4em; }
  .link-how {
    display: inline-flex; align-items: center; gap: 9px;
    font-weight: 500; font-size: clamp(15px, 1.25vw, 18px);
    color: var(--navy); opacity: .8;
    transition: opacity var(--dur-fast) var(--ease-out);
  }
  .link-how:hover { opacity: 1; }
  .link-how svg { transition: transform var(--dur-fast) var(--ease-out); }
  .link-how:hover svg { transform: translateY(3px); }

  .hero__legal {
    position: absolute; z-index: 15; left: 50%; bottom: 20px;
    transform: translateX(-50%);
    color: var(--navy); white-space: nowrap;
  }

  /* ---------- Embed в сборке ---------- */
  html.is-embed .hero { min-height: 0; }
  html.is-embed .top { display: none; }
  html.is-embed .hero__in { padding-top: clamp(150px, 14vw, 190px); padding-bottom: clamp(80px, 9vw, 120px); }

  /* ---------- Адаптив ---------- */
  @media (max-width: 900px) {
    .hero__foot { align-items: flex-start; flex-direction: column; }
  }
  @media (max-width: 760px) {
    .top { padding-block: 16px; }
    .top__in { gap: 10px; }
    .logo { font-size: 15px; gap: 6px; }
    .logo__mark { width: 20px; height: 20px; }
    .logo .chip { font-size: 10px; padding: .4em .7em; }
    .logo__chip { margin-left: 2px; }
    .btn--sm { font-size: 12px; padding: .5em .9em; }

    .hero__in { padding-top: 104px; padding-bottom: 88px; }
    html.is-embed .hero__in { padding-top: 124px; }
    /* на узком экране «в своём городе» не влезает одной строкой в мега-кегль */
    .hero__city { font-size: clamp(40px, 13vw, 72px); }
    .hero__legal { bottom: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .rot, .rot__word { transition: none; }
  }
</style>
</head>
<body>

<section class="hero" id="top">
  <header class="top">
    <div class="container top__in">
      <a class="logo" href="#top" aria-label="Яндекс&nbsp;Лавка · Франшиза">
        <span>Яндекс</span>
        <svg class="logo__mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="16" fill="var(--blue)"/>
          <path d="M16 23.6c-1.9-1.5-7-5-7-9.2 0-2.8 2-4.6 4.3-4.6 1.1 0 2.1.5 2.7 1.4.6-.9 1.6-1.4 2.7-1.4 2.3 0 4.3 1.8 4.3 4.6 0 4.2-5.1 7.7-7 9.2Z" fill="#fff"/>
        </svg>
        <span>Лавка</span>
        <span class="chip chip--active logo__chip">Франшиза</span>
      </a>
      <a class="btn btn--navy btn--sm" href="#form">Стать партнёром</a>
    </div>
  </header>

  <div class="container hero__in">
    <h1 class="hero__h1" aria-label="Запустите Яндекс Лавку в своём городе">
      <span aria-hidden="true">
        <span class="hero__lead">Запустите Яндекс&nbsp;Лавку</span>
        <span class="hero__city"><span class="rot" id="rot"></span></span>
      </span>
    </h1>

    <div class="hero__foot">
      <p class="hero__sub t-sub">Франшиза быстрой доставки продуктов&nbsp;— с&nbsp;технологией, снабжением и&nbsp;поддержкой Яндекса</p>
      <div class="hero__cta">
        <a class="btn btn--blue btn--lg" href="#form">Стать партнёром</a>
        <a class="link-how" href="#how">
          Как это работает
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="m6 13 6 6 6-6"/></svg>
        </a>
      </div>
    </div>
  </div>

  <div class="hero__legal t-legal">Прототип · данные и&nbsp;визуалы&nbsp;— заглушки</div>
</section>

<div class="proto-tag">02 · Hero · city-2&nbsp;— город во всю ширину</div>

<script src="../_shared/proto.js" defer></script>
<script>
  (function () {
    var EMBED = window.top !== window.self || /[?&]embed=1/.test(location.search);
    if (EMBED) document.documentElement.classList.add('is-embed');
    var REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

    var CITIES = ['в Казани', 'в Самаре', 'в Уфе', 'в Тюмени', 'в Ижевске', 'в своём городе'];
    var HOLD = 1500, START = 900, LOOP = false;

    var rot = document.getElementById('rot');
    var last = CITIES.length - 1;
    var words = CITIES.map(function (t, i) {
      var s = document.createElement('span');
      s.className = 'rot__word' + (i === last ? ' is-final' : '');
      s.textContent = t;
      rot.appendChild(s); return s;
    });

    var cur = REDUCED ? last : 0;
    function setW(i) { rot.style.width = words[i].offsetWidth + 'px'; }
    words[cur].classList.add('is-cur');
    setW(cur);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { setW(cur); });
    addEventListener('resize', function () { setW(cur); });

    function next() {
      var prev = cur;
      cur = cur + 1;
      if (cur > last) { if (!LOOP) return; cur = 0; }

      words[prev].classList.remove('is-cur');
      words[prev].classList.add('is-out');
      var w = words[cur];
      w.classList.remove('is-out');
      void w.offsetWidth;
      w.classList.add('is-cur');
      setW(cur);
      setTimeout(function () { words[prev].classList.remove('is-out'); }, 720);

      if (cur < last || LOOP) setTimeout(next, HOLD);
    }
    if (!REDUCED) setTimeout(next, START);
  })();
</script>
<script src="../_shared/preview-shell.js" defer></script>
</body>
</html>
