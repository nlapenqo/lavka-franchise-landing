<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero · Figma prototype</title>
<link rel="stylesheet" href="../_shared/tokens.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  html, body { overflow-x: clip; }
  .hero { position: relative; min-height: 844px; display: grid; place-items: center; overflow: hidden; background: var(--navy); color: #fff; }
  .hero::before, .hero::after { content:""; position:absolute; width: 690px; height: 690px; background: url("../../assets/figma/orbit-small.svg") center/contain no-repeat; opacity:.44; transform: rotate(-33deg); pointer-events:none; }
  .hero::before { right:-240px; top:-310px; }
  .hero::after { right:30px; bottom:-480px; }
  .hero__in { position: relative; z-index: 2; width: min(1100px, calc(100% - 40px)); padding: 120px 0 76px; text-align: center; }
  .headline { font-weight: 900; font-size: clamp(58px,7.64vw,110px); line-height:.9; letter-spacing:-.01em; }
  .headline-line { display:block; overflow:hidden; }
  .headline-line > span { display:block; opacity:0; transform:translateY(110%); animation: line-in 700ms cubic-bezier(.18,.86,.24,1) forwards; }
  .headline-line:nth-child(2) > span { animation-delay:100ms; }
  .city-viewport { height: 1.055em; overflow:hidden; color:var(--blue); }
  .city-stack { display:flex; flex-direction:column; animation:kf-city-drum 24.7s linear infinite; }
  .city { height:1.055em; display:grid; place-items:center; flex:none; }
  @keyframes line-in { to { opacity:1; transform:none; } }
  @keyframes kf-city-drum {
    0%,5.668% { transform:translateY(0); }
    5.668% { animation-timing-function:cubic-bezier(.18,.86,.24,1); }
    10.324%,20.04% { transform:translateY(-1.055em); }
    20.04% { animation-timing-function:cubic-bezier(.18,.86,.24,1); }
    24.696%,34.413% { transform:translateY(-2.11em); }
    34.413% { animation-timing-function:cubic-bezier(.18,.86,.24,1); }
    39.069%,48.785% { transform:translateY(-3.165em); }
    48.785% { animation-timing-function:cubic-bezier(.18,.86,.24,1); }
    53.441%,63.158% { transform:translateY(-4.22em); }
    63.158% { animation-timing-function:cubic-bezier(.18,.86,.24,1); }
    67.814%,77.53% { transform:translateY(-5.275em); }
    77.53% { animation-timing-function:cubic-bezier(.18,.86,.24,1); }
    82.186%,100% { transform:translateY(-6.33em); }
  }
  .hero__sub { width:min(760px,100%); margin:28px auto 0; font-size:clamp(18px,1.6vw,23px); line-height:1.15; font-weight:500; opacity:0; transform:translateY(18px); animation:fade-up 600ms .38s var(--ease-out) forwards; }
  .hero__actions { margin-top:30px; display:flex; align-items:center; justify-content:center; gap:20px; opacity:0; transform:translateY(18px); animation:fade-up 600ms .5s var(--ease-out) forwards; }
  @keyframes fade-up { to { opacity:1; transform:none; } }
  .hero__link { font-size:18px; font-weight:500; padding:16px 2px; }
  .hero__link:hover { color:var(--sky); }
  html.is-embed .hero { min-height:844px; }
  @media(max-width:760px){
    .hero { min-height:720px; }
    html.is-embed .hero { min-height:720px; }
    .hero__in { padding:100px 0 64px; }
    .headline { font-size:clamp(48px,14.7vw,72px); }
    .hero__sub br { display:none; }
    .hero__actions { flex-direction:column; gap:4px; }
    .hero::before { right:-390px; }
    .hero::after { display:none; }
  }
  @media(prefers-reduced-motion:reduce){
    .headline-line > span,.hero__sub,.hero__actions{opacity:1;transform:none;animation:none;}
    .city-stack{animation:none;}
  }
</style>
</head>
<body>
<section class="hero" id="top">
  <div class="hero__in">
    <h1 class="headline">
      <span class="headline-line"><span>Запустите</span></span>
      <span class="headline-line"><span>Яндекс Лавку</span></span>
      <span class="headline-line city-viewport"><span class="city-stack" aria-live="off"><span class="city">в своём городе</span><span class="city">в Казани</span><span class="city">в Самаре</span><span class="city">в Уфе</span><span class="city">в Тюмени</span><span class="city">в Ижевске</span><span class="city">в своём городе</span></span></span>
    </h1>
    <p class="hero__sub">Франшиза быстрой доставки продуктов с технологиями,<br>снабжением и поддержкой Яндекса</p>
    <div class="hero__actions"><a class="btn btn--blue" href="#form">Стать партнёром</a><a class="hero__link" href="#business">Как это работает&nbsp; →</a></div>
  </div>
</section>
<script src="../_shared/preview-shell.js" defer></script>
</body>
</html>
