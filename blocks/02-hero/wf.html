<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02 · Hero · wf — По вайрфрейму</title>
<link rel="stylesheet" href="../_shared/tokens.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  html, body { overflow-x: clip; }
  body { background: var(--bg); }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

  .hero {
    position: relative;
    min-height: clamp(560px, 100vh, 900px);
    display: flex; align-items: center;
    background: var(--bg);
    color: var(--navy);
  }
  .hero__in { width: 100%; padding-block: clamp(56px, 8vh, 96px); }
  .hero__in h1 { max-width: 980px; }
  .hero__sub { max-width: 560px; margin-top: 26px; color: var(--text-dim); }
  .hero__cta { margin-top: 36px; }
  .btn--lg { font-size: clamp(17px, 1.5vw, 21px); padding: 1.1em 2.4em; }

  /* Заглушка визуала: статика, опция — видео-шоурил */
  .visual {
    display: grid; place-content: center; justify-items: center; gap: 14px;
    width: 100%; min-height: clamp(200px, 30vh, 320px);
    margin-top: clamp(36px, 6vh, 64px);
    border: 1.5px dashed var(--sky);
    border-radius: var(--r-card);
    background: linear-gradient(140deg, var(--bg-light), var(--bg-card));
    color: var(--text-dim);
    text-align: center;
  }
  .visual svg { width: 44px; height: 44px; opacity: .7; }
  .visual span { font-family: var(--font-cond); font-weight: 300; font-size: 13px; letter-spacing: .02em; padding-inline: 20px; }

  .hero__legal { margin-top: 28px; }

  @media (max-width: 700px) {
    .hero__sub { margin-top: 20px; }
    .hero__cta .btn { width: 100%; }
    .visual { min-height: 180px; }
  }
</style>
</head>
<body>

<section class="hero" id="top">
  <div class="container hero__in">
    <h1 class="t-h1 reveal">Запустите Яндекс&nbsp;Лавку по&nbsp;франшизе в&nbsp;своём городе</h1>
    <p class="hero__sub t-sub reveal reveal-d1">Войдите в&nbsp;рынок быстрой доставки продуктов вместе с&nbsp;сильным брендом</p>
    <div class="hero__cta reveal reveal-d2">
      <a class="btn btn--blue btn--lg" href="#form">Стать партнёром</a>
    </div>

    <div class="visual reveal reveal-d3" role="img" aria-label="Заглушка визуала первого экрана">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m3 17 5-4 3 2 5-5 5 5"/></svg>
      <span>визуал: статика · опция — видео-шоурил (реф. drinkit)</span>
    </div>

    <p class="hero__legal t-legal">Прототип · данные и визуалы — заглушки</p>
  </div>
</section>

<div class="proto-tag">02 · Hero · wf — По вайрфрейму</div>

<script src="../_shared/proto.js" defer></script>
<script src="../_shared/preview-shell.js" defer></script>
</body>
</html>
