<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>03 · Мероприятие · v2 — Плашка-баннер</title>
<link rel="stylesheet" href="../_shared/tokens.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  body { overflow-x: clip; }

  /* --- соседние блоки-заглушки --- */
  .ghost {
    height: 42vh;
    display: grid; place-items: center;
    background: var(--bg-light);
    outline: 1.5px dashed var(--sky); outline-offset: -14px;
  }
  .ghost span {
    font-weight: 500; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--text-dim); opacity: .55;
  }

  /* ============ 03 · v2 — плашка-баннер ============ */
  .event-section { padding-block: clamp(28px, 4vw, 56px); }

  .event-banner {
    position: relative;
    display: flex; align-items: center; gap: clamp(24px, 4vw, 56px);
    min-height: clamp(140px, 13vw, 180px);
    padding: clamp(24px, 3vw, 40px) clamp(24px, 3.5vw, 48px);
    border-radius: var(--r-card);
    background: linear-gradient(135deg, var(--navy) 0%, var(--accent-blue) 100%);
    color: var(--text-on-dark);
    overflow: hidden;
    box-shadow: var(--shadow-card);
  }

  .event-banner__info {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: flex-start;
    gap: clamp(10px, 1.2vw, 14px);
  }
  .event-banner__title { color: #fff; }
  .event-banner__date {
    display: inline-flex; align-items: center; gap: 9px;
    font-weight: 500; font-size: clamp(14px, 1.2vw, 17px);
    color: var(--text-dim-dark);
  }
  .event-banner__date svg { width: 18px; height: 18px; flex: none; }

  /* чип «набор открыт» с пульсирующей точкой */
  .chip--live { background: var(--blue); color: #fff; gap: 9px; }
  .chip--live .pulse {
    position: relative; width: 8px; height: 8px; border-radius: 50%;
    background: #fff; flex: none;
  }
  .chip--live .pulse::after {
    content: ""; position: absolute; inset: -4px; border-radius: 50%;
    border: 1.5px solid #fff;
    animation: dot-pulse 2s var(--ease-out) infinite;
  }
  @keyframes dot-pulse {
    0%   { transform: scale(.5); opacity: .9; }
    70%  { transform: scale(1.5); opacity: 0; }
    100% { transform: scale(1.5); opacity: 0; }
  }

  .event-banner__cta {
    position: relative; z-index: 1;
    margin-left: auto; flex: none;
  }
  .event-banner__cta svg { width: 20px; height: 20px; }

  /* декор: созвездие точек-городов + кольца-пульсы */
  .constellation {
    position: absolute; z-index: 0; pointer-events: none;
    right: clamp(120px, 16vw, 230px); top: 50%;
    width: clamp(260px, 34vw, 480px); height: 200px;
    transform: translateY(-50%);
    opacity: .6;
  }
  .constellation .ring {
    fill: none; stroke: #fff; stroke-width: 1.5;
    transform-box: fill-box; transform-origin: center;
    opacity: 0;
    animation: ring-pulse 3.6s var(--ease-out) infinite;
  }
  .constellation .ring--2 { animation-delay: 1.2s; }
  .constellation .ring--3 { animation-delay: 2.4s; }
  @keyframes ring-pulse {
    0%   { transform: scale(.35); opacity: .8; }
    75%  { transform: scale(1.7); opacity: 0; }
    100% { transform: scale(1.7); opacity: 0; }
  }

  @media (max-width: 640px) {
    .event-banner {
      flex-direction: column; align-items: stretch;
      gap: 20px;
      padding: 24px 20px;
    }
    .event-banner__info { align-items: flex-start; }
    .event-banner__cta { margin-left: 0; width: 100%; }
    .constellation {
      right: -40px; top: -10px; transform: none;
      width: 240px; height: 150px; opacity: .3;
    }
  }

  .legal { text-align: center; padding: 22px 16px 30px; }
</style>
</head>
<body>
  <div class="proto-tag">03 · Мероприятие · v2 — Плашка-баннер</div>

  <section class="ghost"><span>соседний блок · хиро</span></section>

  <section class="event-section">
    <div class="container">
      <div class="event-banner reveal">

        <!-- декоративное созвездие -->
        <svg class="constellation" viewBox="0 0 480 200" aria-hidden="true">
          <g fill="#fff">
            <circle cx="24"  cy="150" r="2.5" opacity=".35"/>
            <circle cx="62"  cy="58"  r="3"   opacity=".5"/>
            <circle cx="104" cy="118" r="2"   opacity=".3"/>
            <circle cx="142" cy="38"  r="2.5" opacity=".45"/>
            <circle cx="184" cy="94"  r="3.5" opacity=".7"/>
            <circle cx="222" cy="152" r="2"   opacity=".3"/>
            <circle cx="256" cy="52"  r="2.5" opacity=".45"/>
            <circle cx="300" cy="112" r="3"   opacity=".6"/>
            <circle cx="336" cy="30"  r="2"   opacity=".3"/>
            <circle cx="368" cy="88"  r="2.5" opacity=".45"/>
            <circle cx="404" cy="152" r="3"   opacity=".5"/>
            <circle cx="444" cy="60"  r="2"   opacity=".3"/>
            <circle cx="70"  cy="172" r="2"   opacity=".25"/>
            <circle cx="292" cy="178" r="2.5" opacity=".35"/>
          </g>
          <circle class="ring"         cx="184" cy="94"  r="18"/>
          <circle class="ring ring--2" cx="300" cy="112" r="16"/>
          <circle class="ring ring--3" cx="62"  cy="58"  r="14"/>
        </svg>

        <div class="event-banner__info">
          <span class="chip chip--live"><span class="pulse"></span>Набор открыт</span>
          <h2 class="t-h3 event-banner__title">День партнёров Яндекс&nbsp;Лавки</h2>
          <span class="event-banner__date">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="16" rx="3"/>
              <path d="M3 10h18M8 3v4M16 3v4"/>
            </svg>
            27 августа · Москва-Сити
          </span>
        </div>

        <a class="btn btn--white event-banner__cta" href="#event-form">
          Участвовать
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 12h15"/><path d="M13 6l6 6-6 6"/>
          </svg>
        </a>

      </div>
    </div>
  </section>

  <section class="ghost"><span>соседний блок</span></section>

  <p class="t-legal legal">Прототип · данные — заглушка (рыба)</p>

  <script src="../_shared/proto.js" defer></script>
<script src="../_shared/preview-shell.js" defer></script>
</body>
</html>
