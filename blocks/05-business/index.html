<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Как устроен бизнес? · 6 вариантов</title>
  <link rel="stylesheet" href="concept-shared.css">
  <style>
    html,
    body {
      min-width: 0;
    }

    body {
      background: #edf4fb;
    }

    .compare {
      width: min(1280px, calc(100% - 48px));
      margin-inline: auto;
      padding-block: 46px 72px;
    }

    .compare__head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 480px;
      gap: 56px;
      align-items: end;
      margin-bottom: 28px;
    }

    .compare__head h1 {
      max-width: 720px;
      font-size: clamp(48px, 5.4vw, 72px);
      font-weight: 900;
      line-height: .92;
      letter-spacing: -.01em;
      text-wrap: balance;
    }

    .compare__head p {
      color: var(--text-dim);
      font-size: 17px;
      line-height: 1.4;
      text-wrap: pretty;
    }

    .compare__tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .compare__tab {
      position: relative;
      min-width: 0;
      min-height: 86px;
      padding: 16px 18px 17px;
      overflow: hidden;
      border: 1px solid rgba(27, 58, 106, .08);
      border-radius: 20px;
      color: var(--navy);
      text-align: left;
      background: rgba(255, 255, 255, .86);
      box-shadow: 0 7px 22px rgba(27, 58, 106, .045);
      transition: color .3s var(--ease-out), background .3s var(--ease-out),
                  transform .3s var(--ease-out), box-shadow .3s var(--ease-out);
    }

    .compare__tab:hover {
      transform: translateY(-2px);
      box-shadow: 0 11px 28px rgba(27, 58, 106, .08);
    }

    .compare__tab[aria-selected="true"] {
      color: #fff;
      background: var(--navy);
      box-shadow: 0 12px 32px rgba(27, 58, 106, .16);
    }

    .compare__tab span,
    .compare__tab strong {
      display: block;
    }

    .compare__tab span {
      margin-bottom: 7px;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
    }

    .compare__tab[aria-selected="true"] span {
      color: var(--sky);
    }

    .compare__tab strong {
      overflow: hidden;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.05;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .compare__stage {
      position: relative;
      padding: 8px;
      overflow: hidden;
      border-radius: 32px;
      background: rgba(27, 58, 106, .08);
      box-shadow: 0 24px 68px rgba(27, 58, 106, .13),
                  inset 0 0 0 1px rgba(27, 58, 106, .04);
    }

    .compare__stage::after {
      content: '';
      position: absolute;
      inset: 8px;
      z-index: 2;
      border-radius: 25px;
      background: rgba(242, 247, 252, .64);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
    }

    .compare__stage.is-loading::after {
      opacity: 1;
    }

    iframe {
      display: block;
      width: 100%;
      height: 1180px;
      overflow: hidden;
      border: 0;
      border-radius: 25px;
      background: #fff;
      transition: height .35s var(--ease-out);
    }

    .compare__foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      margin-top: 18px;
      color: var(--text-dim);
      font-size: 14px;
      line-height: 1.35;
    }

    .compare__open {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--navy);
      font-weight: 500;
      white-space: nowrap;
    }

    .compare__open::after {
      content: '↗';
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff;
    }

    @media (max-width: 960px) {
      .compare {
        width: min(100% - 28px, 1280px);
      }

      .compare__head {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .compare__head p {
        max-width: 680px;
      }

      .compare__tabs {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main class="compare">
    <header class="compare__head">
      <h1>Как устроен бизнес?<br>Шесть решений</h1>
      <p>Один и тот же полный контент собран в шести разных сценариях чтения — от спокойного продолжения текущего лендинга до более самостоятельных моделей бизнеса.</p>
    </header>

    <nav class="compare__tabs" role="tablist" aria-label="Варианты блока">
      <button class="compare__tab" type="button" role="tab" aria-selected="true" aria-controls="preview" data-src="concept-01.html" data-note="Сдержанный · вопрос и объяснение собраны на одной редакционной оси">
        <span>Сдержанный</span>
        <strong>Редакционная ось</strong>
      </button>
      <button class="compare__tab" type="button" role="tab" aria-selected="false" aria-controls="preview" data-src="concept-02.html" data-note="Сдержанный · обязательства читаются как открытый партнёрский реестр">
        <span>Сдержанный</span>
        <strong>Реестр ответственности</strong>
      </button>
      <button class="compare__tab" type="button" role="tab" aria-selected="false" aria-controls="preview" data-src="concept-03.html" data-note="Сбалансированный · путь заказа приводит к разделению двух зон управления">
        <span>Сбалансированный</span>
        <strong>Путь и две зоны</strong>
      </button>
      <button class="compare__tab" type="button" role="tab" aria-selected="false" aria-controls="preview" data-src="concept-04.html" data-note="Сбалансированный · городская операционка опирается на систему Яндекс Лавки">
        <span>Сбалансированный</span>
        <strong>Операционный стек</strong>
      </button>
      <button class="compare__tab" type="button" role="tab" aria-selected="false" aria-controls="preview" data-src="concept-05.html" data-note="Уникальный · заказ помещён между двумя сквозными системами ответственности">
        <span>Более уникальный</span>
        <strong>Заказ между системами</strong>
      </button>
      <button class="compare__tab" type="button" role="tab" aria-selected="false" aria-controls="preview" data-src="concept-06.html" data-note="Уникальный · обязанности перегруппированы по трём функциональным слоям бизнеса">
        <span>Более уникальный</span>
        <strong>Три слоя бизнеса</strong>
      </button>
    </nav>

    <section class="compare__stage" id="stage" aria-label="Предпросмотр выбранного варианта">
      <iframe id="preview" src="concept-01.html?embed=1" title="Сдержанный вариант: Редакционная ось"></iframe>
    </section>

    <footer class="compare__foot">
      <span id="note">Сдержанный · вопрос и объяснение собраны на одной редакционной оси</span>
      <a class="compare__open" id="open" href="concept-01.html" target="_blank" rel="noopener">Открыть отдельно</a>
    </footer>
  </main>

  <script>
    (() => {
      const tabs = [...document.querySelectorAll('.compare__tab')];
      const frame = document.getElementById('preview');
      const stage = document.getElementById('stage');
      const note = document.getElementById('note');
      const open = document.getElementById('open');
      let resizeObserver;

      const syncHeight = () => {
        const doc = frame.contentDocument;
        if (!doc) return;
        const height = Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight);
        if (height > 0) frame.style.height = `${height}px`;
      };

      const observeFrame = () => {
        if (resizeObserver) resizeObserver.disconnect();
        const body = frame.contentDocument?.body;
        if (!body) return;
        resizeObserver = new ResizeObserver(syncHeight);
        resizeObserver.observe(body);
        syncHeight();
      };

      const activate = (tab, pushHash = true) => {
        const src = tab.dataset.src;
        tabs.forEach(item => item.setAttribute('aria-selected', String(item === tab)));
        note.textContent = tab.dataset.note;
        open.href = src;
        frame.title = `${tab.querySelector('span').textContent}: ${tab.querySelector('strong').textContent}`;
        stage.classList.add('is-loading');
        frame.src = `${src}?embed=1`;
        if (pushHash) history.replaceState(null, '', `#${src.replace('.html', '')}`);
      };

      frame.addEventListener('load', () => {
        observeFrame();
        requestAnimationFrame(() => stage.classList.remove('is-loading'));
      });

      tabs.forEach(tab => tab.addEventListener('click', () => activate(tab)));

      const initial = location.hash.slice(1);
      const initialTab = tabs.find(tab => tab.dataset.src === `${initial}.html`);
      if (initialTab) activate(initialTab, false);
    })();
  </script>
</body>
</html>
