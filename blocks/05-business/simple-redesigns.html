<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Как устроен бизнес · 6 спокойных вариантов</title><link rel="stylesheet" href="../_shared/tokens.css"><link rel="stylesheet" href="../_shared/base.css">
<style>
  body{background:#eef5fb;min-width:1100px}.review{max-width:1440px;margin:auto;padding:42px 42px 72px}.review-head{display:flex;justify-content:space-between;align-items:flex-end;gap:50px;margin-bottom:28px}.review-head h1{font-size:52px;line-height:.92;font-weight:900;letter-spacing:-.02em}.review-head p{max-width:520px;color:var(--text-dim);font-size:17px;line-height:1.3}.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}.tab{border:0;border-radius:18px;background:#fff;color:var(--navy);padding:16px;text-align:left;min-height:86px;box-shadow:0 5px 18px rgba(27,58,106,.055);transition:transform .45s var(--ease-out),background .45s var(--ease-out),color .45s var(--ease-out)}.tab:hover{transform:translateY(-3px)}.tab.is-active{background:var(--navy);color:#fff}.tab small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.62;margin-bottom:7px}.tab strong{font-size:15px;line-height:1.08}.frame-shell{padding:8px;border-radius:32px;background:rgba(27,58,106,.07);box-shadow:inset 0 0 0 1px rgba(27,58,106,.05),0 24px 68px rgba(27,58,106,.12)}iframe{display:block;width:100%;height:1040px;border:0;border-radius:25px;background:#fff}.review-foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px;color:var(--text-dim);font-size:13px}.open{color:var(--navy);font-weight:500}
</style></head><body><main class="review">
  <header class="review-head"><div><span class="t-label">Блок 05 · спокойный раунд</span><h1>6 вариантов<br>ближе к оригиналу</h1></div><p>Сохранил исходную конструкцию Figma: заголовок, светлая карточка, курьер и две зоны ответственности. Варианты отличаются только компоновкой длинного текста.</p></header>
  <nav class="tabs" aria-label="Выбор варианта"><button class="tab is-active" data-src="simple-1.html"><small>01 · База</small><strong>Полировка оригинала</strong></button><button class="tab" data-src="simple-2.html"><small>02 · Цельно</small><strong>Одна карточка</strong></button><button class="tab" data-src="simple-3.html"><small>03 · Баланс</small><strong>Визуал слева</strong></button><button class="tab" data-src="simple-4.html"><small>04 · Роли</small><strong>Сначала главное</strong></button><button class="tab" data-src="simple-5.html"><small>05 · Навигация</small><strong>Три таба</strong></button><button class="tab" data-src="simple-6.html"><small>06 · Короче</small><strong>Компактный блок</strong></button></nav>
  <div class="frame-shell"><iframe id="preview" src="simple-1.html?embed=1" title="Предпросмотр варианта"></iframe></div><footer class="review-foot"><span id="caption">01 · Исходная композиция после аккуратной полировки</span><a class="open" id="open" href="simple-1.html" target="_blank">Открыть отдельно ↗</a></footer>
</main><script>(()=>{const tabs=[...document.querySelectorAll('.tab')],frame=document.getElementById('preview'),open=document.getElementById('open'),caption=document.getElementById('caption'),notes=['01 · Исходная композиция после аккуратной полировки','02 · Весь смысл собран внутри одной светлой карточки','03 · Тот же сплит, но визуал расположен слева','04 · Вводная компактнее, зоны ответственности заметнее','05 · Одна исходная карточка с тремя спокойными табами','06 · Укороченная композиция без потери актуального текста'];tabs.forEach((tab,i)=>tab.addEventListener('click',()=>{tabs.forEach(x=>x.classList.remove('is-active'));tab.classList.add('is-active');frame.src=tab.dataset.src+'?embed=1';open.href=tab.dataset.src;caption.textContent=notes[i]}))})();</script></body></html>
