<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>07 · Как стать партнёром · v4 — Компактный маршрут</title>
<link rel="stylesheet" href="../_shared/tokens.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  body { overflow-x: clip; background: var(--bg-light); }
  .context { min-height: 24vh; display: grid; place-items: center; color: var(--text-dim); }
  .route { padding-block: clamp(34px, 4vw, 56px); background: var(--bg); border-block: 1px solid var(--sky); }
  .route__row { display: grid; grid-template-columns: minmax(190px, .55fr) minmax(0, 1.45fr); gap: clamp(24px, 4vw, 54px); align-items: center; }
  .route__head .t-label { display: block; margin-bottom: 10px; }
  .route__head h1 { font-size: clamp(27px, 3vw, 42px); }
  .steps { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding: 8px 2px; scrollbar-width: none; scroll-snap-type: x proximity; }
  .steps::-webkit-scrollbar { display: none; }
  .step { display: flex; align-items: center; gap: 8px; flex: 1 0 auto; scroll-snap-align: start; }
  .step__pill { min-height: 58px; display: inline-flex; align-items: center; gap: 10px; padding: 11px 16px 11px 11px; border-radius: var(--r-pill); background: var(--bg-card); white-space: nowrap; }
  .step:last-child .step__pill { background: var(--blue); color: var(--text-on-dark); }
  .step__num { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: var(--bg); color: var(--navy); font-size: 12px; font-weight: 800; }
  .step__name { font-weight: 700; font-size: 14px; }
  .step__arrow { width: 18px; color: var(--mid-blue); flex: none; }
  .legal { margin-top: 14px; text-align: right; }
  @media (max-width: 760px) { .route__row { grid-template-columns: 1fr; gap: 18px; } .legal { text-align: left; } }
</style>
</head>
<body>
<div class="proto-tag">07 · Как стать партнёром · v4 — Компактный маршрут</div>
<section class="route"><div class="container"><div class="route__row">
  <header class="route__head"><span class="t-label">Пять шагов</span><h1 class="t-h3">До запуска — вместе</h1></header>
  <ol class="steps" aria-label="Этапы партнёрства">
    <li class="step"><span class="step__pill"><span class="step__num">01</span><span class="step__name">Заявка</span></span><svg class="step__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></li>
    <li class="step"><span class="step__pill"><span class="step__num">02</span><span class="step__name">Встреча</span></span><svg class="step__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></li>
    <li class="step"><span class="step__pill"><span class="step__num">03</span><span class="step__name">Договор</span></span><svg class="step__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></li>
    <li class="step"><span class="step__pill"><span class="step__num">04</span><span class="step__name">Подготовка</span></span><svg class="step__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></li>
    <li class="step"><span class="step__pill"><span class="step__num">05</span><span class="step__name">Запуск</span></span></li>
  </ol>
</div><p class="t-legal legal">Прототип · данные — заглушка (рыба)</p></div></section>
<script src="../_shared/proto.js" defer></script>
<script src="../_shared/preview-shell.js" defer></script>
</body>
</html>
