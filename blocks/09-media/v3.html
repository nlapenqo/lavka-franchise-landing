  @media (max-width: 760px) { .media-strip__row { grid-template-columns: 1fr; } .stories { display: flex; overflow-x: auto; border-left: 0; scroll-snap-type: x mandatory; scrollbar-width: none; } .stories::-webkit-scrollbar { display: none; } .story { flex: 0 0 78vw; border-left: 1px solid var(--mid-blue); scroll-snap-align: start; } .legal { text-align: left; } }
