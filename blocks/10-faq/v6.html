<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10 · Q&amp;A · v6 — Карточки-перевёртыши</title>
<link rel="stylesheet" href="../_shared/tokens.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  body { overflow-x: clip; background: var(--bg); }
  .qa__head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: clamp(38px, 5vw, 68px); }
  .qa__head .t-label { display: block; margin-bottom: 16px; }
  .qa__head > p { max-width: 380px; color: var(--text-dim); }
  .deck { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(14px, 1.8vw, 24px); }
  .flip { width: 100%; min-height: clamp(240px, 24vw, 300px); perspective: 1400px; text-align: left; border-radius: var(--r-card); }
  .flip:focus-visible { outline: 3px solid var(--blue); outline-offset: 5px; }
  .flip__inner { display: grid; width: 100%; height: 100%; min-height: inherit; transform-style: preserve-3d; transition: transform .7s var(--ease-out); }
  .flip.is-open .flip__inner { transform: rotateY(180deg); }
  .face { grid-area: 1 / 1; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; padding: clamp(22px, 2.4vw, 32px); border-radius: var(--r-card); backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .face--front { background: var(--bg-card); color: var(--navy); }
  .flip:nth-child(2) .face--front { background: var(--sky); }
  .flip:nth-child(3) .face--front { background: var(--navy); color: var(--text-on-dark); }
  .flip:nth-child(4) .face--front { background: var(--warm-gray); }
  .flip:nth-child(5) .face--front { background: var(--sky); }
  .flip:nth-child(6) .face--front { background: var(--bg-card); }
  .face--back { background: var(--navy); color: var(--text-on-dark); transform: rotateY(180deg); }
  .flip:nth-child(3) .face--back { background: var(--blue); }
  .face__top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .face__num { font-family: var(--font-cond); font-weight: 300; font-size: 15px; letter-spacing: .06em; opacity: .65; }
  .face__q { font-weight: 800; font-size: clamp(21px, 1.9vw, 28px); line-height: 1.02; }
  .face__plus { align-self: flex-end; flex: none; width: 44px; height: 44px; position: relative; border-radius: 50%; background: rgba(255, 255, 255, .75); transition: transform var(--dur-fast) var(--ease-out); }
  .flip:nth-child(3) .face__plus { background: rgba(255, 255, 255, .18); }
  .face__plus::before, .face__plus::after { content: ""; position: absolute; left: 50%; top: 50%; width: 18px; height: 2px; border-radius: 2px; background: currentColor; transform: translate(-50%, -50%); }
  .face__plus::after { transform: translate(-50%, -50%) rotate(90deg); }
  .flip:hover .face__plus { transform: rotate(90deg); }
  .face__a { font-size: clamp(15px, 1.25vw, 19px); line-height: 1.4; color: var(--text-dim-dark); }
  .flip:nth-child(3) .face__a { color: rgba(255, 255, 255, .88); }
  .face__close { display: inline-flex; align-items: center; gap: 8px; align-self: flex-end; font-family: var(--font-cond); font-weight: 300; font-size: 13px; letter-spacing: .05em; opacity: .7; }
  .qa__tg { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px; margin-top: clamp(36px, 5vw, 60px); padding: 26px 30px; border-radius: var(--r-card-sm); background: var(--bg-light); }
  .qa__tg p { font-weight: 500; }
  .legal { text-align: center; padding: 8px var(--container-pad) 36px; }
  @media (max-width: 1000px) { .deck { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 620px) {
    .deck { grid-template-columns: 1fr; }
    .flip { min-height: 220px; }
    .qa__tg { flex-direction: column; align-items: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) {
    .flip__inner { transition: none; }
    .flip:hover .face__plus { transform: none; }
  }
</style>
</head>
<body>
<div class="proto-tag">10 · Q&amp;A · v6 — Карточки-перевёртыши</div>

<section class="section qa">
  <div class="container">
    <header class="qa__head reveal">
      <div>
        <span class="t-label">Вопросы и ответы</span>
        <h1 class="t-h1">Ответы — на&nbsp;обороте</h1>
      </div>
      <p class="t-sub">Шесть карточек — всё, что важно знать до&nbsp;первой встречи</p>
    </header>

    <div class="deck">
      <button class="flip reveal" type="button" aria-expanded="false"><span class="flip__inner">
        <span class="face face--front"><span class="face__top"><span class="face__q">Что такое даркстор?</span><span class="face__num">01</span></span><span class="face__plus" aria-hidden="true"></span></span>
        <span class="face face--back"><span class="face__a">Магазин-склад без покупателей в&nbsp;зале. Сборщики комплектуют онлайн-заказы, а&nbsp;курьеры доставляют их жителям ближайших районов.</span><span class="face__close" aria-hidden="true">свернуть ×</span></span>
      </span></button>
      <button class="flip reveal reveal-d1" type="button" aria-expanded="false"><span class="flip__inner">
        <span class="face face--front"><span class="face__top"><span class="face__q">Какой размер инвестиций?</span><span class="face__num">02</span></span><span class="face__plus" aria-hidden="true"></span></span>
        <span class="face face--back"><span class="face__a">Ориентир для одного даркстора — от&nbsp;15&nbsp;млн&nbsp;₽, для городской сети — от&nbsp;75&nbsp;млн&nbsp;₽. Сумма зависит от&nbsp;формата и&nbsp;города.</span><span class="face__close" aria-hidden="true">свернуть ×</span></span>
      </span></button>
      <button class="flip reveal reveal-d2" type="button" aria-expanded="false"><span class="flip__inner">
        <span class="face face--front"><span class="face__top"><span class="face__q">Сколько занимает запуск?</span><span class="face__num">03</span></span><span class="face__plus" aria-hidden="true"></span></span>
        <span class="face face--back"><span class="face__a">Около трёх месяцев на&nbsp;первый даркстор и&nbsp;около четырёх — на&nbsp;запуск сети в&nbsp;городе. График зависит от&nbsp;помещений и&nbsp;масштаба.</span><span class="face__close" aria-hidden="true">свернуть ×</span></span>
      </span></button>
      <button class="flip reveal reveal-d1" type="button" aria-expanded="false"><span class="flip__inner">
        <span class="face face--front"><span class="face__top"><span class="face__q">Каким должно быть помещение?</span><span class="face__num">04</span></span><span class="face__plus" aria-hidden="true"></span></span>
        <span class="face face--back"><span class="face__a">Ориентир — от&nbsp;350&nbsp;м², удобный подъезд, зона разгрузки и&nbsp;место для велопарковки. Потенциал точки проверяем вместе.</span><span class="face__close" aria-hidden="true">свернуть ×</span></span>
      </span></button>
      <button class="flip reveal reveal-d2" type="button" aria-expanded="false"><span class="flip__inner">
        <span class="face face--front"><span class="face__top"><span class="face__q">Кто выбирает локацию?</span><span class="face__num">05</span></span><span class="face__plus" aria-hidden="true"></span></span>
        <span class="face face--back"><span class="face__a">Партнёр ищет варианты, а&nbsp;геоаналитики Яндекса оценивают спрос, логистику и&nbsp;покрытие. Решение принимается вместе.</span><span class="face__close" aria-hidden="true">свернуть ×</span></span>
      </span></button>
      <button class="flip reveal reveal-d3" type="button" aria-expanded="false"><span class="flip__inner">
        <span class="face face--front"><span class="face__top"><span class="face__q">Какая команда нужна?</span><span class="face__num">06</span></span><span class="face__plus" aria-hidden="true"></span></span>
        <span class="face face--back"><span class="face__a">Управляющая команда: директор, заместители, сборщики и&nbsp;курьеры. Точный штат зависит от&nbsp;города и&nbsp;числа дарксторов.</span><span class="face__close" aria-hidden="true">свернуть ×</span></span>
      </span></button>
    </div>

    <aside class="qa__tg reveal">
      <p class="t-sub">Не нашли свою карточку? Разбираем модель в&nbsp;Telegram-канале</p>
      <a class="btn btn--navy" href="https://t.me/yandex_lavka_franchise">Перейти в&nbsp;Telegram</a>
    </aside>
  </div>
</section>

<p class="t-legal legal">Прототип · данные — заглушка (рыба)</p>
<script>
  document.querySelectorAll('.flip').forEach((card) => {
    card.addEventListener('click', () => {
      const open = card.classList.toggle('is-open');
      card.setAttribute('aria-expanded', String(open));
    });
  });
</script>
<script src="../_shared/proto.js" defer></script>
<script src="../_shared/preview-shell.js" defer></script>
</body>
</html>
