<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e2241">
<title>Мобильный концепт · Франшиза Яндекс Лавки</title>
<meta name="description" content="Мобильная версия лендинга франшизы Яндекс Лавки в макете iPhone">
<link rel="icon" href="data:,">
<script>
/* Телефон открывает сам концепт во весь экран — рамка нужна только там,
   где окно шире макета. Редирект стоит до <body>, поэтому мигания нет. */
(() => {
  const phone = matchMedia('(max-width: 767px)');
  const jump = () => { if (phone.matches) location.replace('./e-figma.html' + location.hash); };
  jump();
  phone.addEventListener ? phone.addEventListener('change', jump) : phone.addListener(jump);
})();
</script>
<style>
:root{
  --navy:#1b3a6a; --blue:#00adff; --ink:#0b1c34;
  --k:1;                                   /* масштаб макета под высоту окна */
  --dev-w:414px; --dev-h:868px;            /* корпус: экран 390×844 + рамка 12 */
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  /* витрина занимает ровно экран и никогда не прокручивается:
     дробные доли пикселя в высоте макета иначе вызывают полосу прокрутки */
  height:100%;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;
  padding:24px 24px 32px;
  background:
    radial-gradient(120% 90% at 8% -10%,rgba(0,173,255,.30),rgba(0,173,255,0) 58%),
    radial-gradient(90% 80% at 100% 110%,rgba(0,173,255,.18),rgba(0,173,255,0) 60%),
    linear-gradient(170deg,#123059,#0b1c34 62%,#08152a);
  color:#e8f1fb;
  font:400 15px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* ---------- подпись над макетом ---------- */
.cap{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:20px;text-align:center}
.cap h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
.cap p{margin:0;font-size:13.5px;color:rgba(190,214,244,.72)}
.cap a{color:var(--blue);text-decoration:none;border-bottom:1px solid rgba(0,173,255,.35);padding-bottom:1px}
.cap a:hover{border-bottom-color:var(--blue)}

/* ---------- сцена: держит высоту отмасштабированного корпуса ---------- */
.stage{height:calc(var(--dev-h) * var(--k));flex:none}
.device{
  position:relative;width:var(--dev-w);height:var(--dev-h);
  transform:scale(var(--k));transform-origin:top center;
  filter:drop-shadow(0 46px 70px rgba(3,12,28,.62)) drop-shadow(0 10px 22px rgba(3,12,28,.45));
}
/* корпус рисуется вектором и не зависит от плотности экрана */
.device__frame{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:2}
/* экран — ровно 390×844, чтобы концепт лёг в свою проектную ширину */
.device__screen{
  position:absolute;left:12px;top:12px;width:390px;height:844px;
  border:0;border-radius:50px;background:#0b1c34;z-index:1;display:block;
}

@media (max-width:767px){
  /* запасной путь, если JS выключен: отдаём концепт во весь экран без рамки */
  body{padding:0;display:block;overflow:visible}
  .cap,.device__frame{display:none}
  .stage{height:auto}
  .device{width:auto;height:auto;transform:none;filter:none}
  .device__screen{position:fixed;inset:0;width:100%;height:100%;border-radius:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="cap">
  <h1>Франшиза Яндекс Лавки — мобильный концепт</h1>
  <p>Откройте страницу с телефона, чтобы увидеть её без рамки · <a href="./e-figma.html?full=1">открыть в полный экран</a></p>
</div>

<div class="stage">
  <div class="device">
    <iframe class="device__screen" src="./e-figma.html?frame=iphone" title="Мобильный лендинг франшизы Яндекс Лавки" loading="eager"></iframe>

    <svg class="device__frame" viewBox="-5 0 424 868" width="414" height="868" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <!-- титановый корпус: чередование бликов и теней по периметру -->
        <linearGradient id="ti" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#eef1f5"/><stop offset=".14" stop-color="#a4abb4"/>
          <stop offset=".3" stop-color="#f4f6f9"/><stop offset=".5" stop-color="#959ca5"/>
          <stop offset=".68" stop-color="#e6eaef"/><stop offset=".86" stop-color="#8e959e"/>
          <stop offset="1" stop-color="#ced4db"/>
        </linearGradient>
        <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#7f868f"/><stop offset=".5" stop-color="#d9dee4"/>
          <stop offset="1" stop-color="#868d96"/>
        </linearGradient>
        <!-- маска: всё, кроме окна экрана, чтобы корпус не перекрывал iframe -->
        <mask id="cut">
          <rect x="-5" y="-5" width="424" height="878" fill="#fff"/>
          <rect x="12" y="12" width="390" height="844" rx="50" fill="#000"/>
        </mask>
      </defs>

      <g mask="url(#cut)">
        <!-- боковые клавиши: кнопка действия, качелька громкости, питание -->
        <rect x="-4" y="150" width="6" height="32" rx="3" fill="url(#btn)"/>
        <rect x="-4" y="206" width="6" height="64" rx="3" fill="url(#btn)"/>
        <rect x="-4" y="282" width="6" height="64" rx="3" fill="url(#btn)"/>
        <rect x="412" y="228" width="6" height="104" rx="3" fill="url(#btn)"/>
        <!-- корпус и внутренняя чёрная кромка стекла -->
        <rect x="0" y="0" width="414" height="868" rx="62" fill="url(#ti)"/>
        <rect x="3.5" y="3.5" width="407" height="861" rx="58.5" fill="#0a0d12"/>
        <rect x="1" y="1" width="412" height="866" rx="61" stroke="rgba(255,255,255,.55)" stroke-width="1.4"/>
      </g>

      <!-- динамический остров с глазком камеры -->
      <rect x="144" y="23" width="126" height="37" rx="18.5" fill="#05070b"/>
      <circle cx="252" cy="41.5" r="6.4" fill="#0d1218"/>
      <circle cx="250" cy="39.5" r="2.1" fill="#1d3550"/>

      <!-- статус-бар: под него концепт отводит safe-area сверху -->
      <g fill="#fff">
        <text x="66" y="47" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15.5" font-weight="600" letter-spacing=".2">9:41</text>
        <rect x="314" y="38" width="3" height="6" rx="1.2" opacity=".45"/>
        <rect x="319.5" y="35.5" width="3" height="8.5" rx="1.2" opacity=".65"/>
        <rect x="325" y="33" width="3" height="11" rx="1.2"/>
        <rect x="330.5" y="30.5" width="3" height="13.5" rx="1.2"/>
        <path d="M341.4 34.6a10.6 10.6 0 0 1 13.2 0" stroke="#fff" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <path d="M344.3 38.3a6.1 6.1 0 0 1 7.4 0" stroke="#fff" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <circle cx="348" cy="42.2" r="1.5"/>
        <rect x="363" y="33.5" width="25" height="13" rx="4" stroke="#fff" stroke-opacity=".45" stroke-width="1.2" fill="none"/>
        <rect x="364.8" y="35.3" width="18" height="9.4" rx="2.6"/>
        <path d="M389.6 37.6v5.2a2.9 2.9 0 0 0 0-5.2z" opacity=".45"/>
      </g>

      <!-- индикатор «домой» -->
      <rect x="137" y="842" width="140" height="5" rx="2.5" fill="#fff" opacity=".9"/>
    </svg>
  </div>
</div>

<script>
/* Корпус ужимаем под высоту окна, чтобы айфон целиком помещался без прокрутки. */
(() => {
  const fit = () => {
    /* 76 = верхний и нижний отступы плюс зазор под подписью; 2px — запас на округление */
    const room = innerHeight - document.querySelector('.cap').offsetHeight - 76 - 2;
    document.documentElement.style.setProperty('--k', Math.min(1, Math.max(.3, room / 868)).toFixed(4));
  };
  fit();
  addEventListener('resize', fit, { passive: true });
})();
</script>
</body>
</html>
